backend:
  name: git-gateway
  branch: main # Branch to update (optional; defaults to master)
media_folder: static/img
public_folder: /img
collections:
  - name: 'actualites'
    label: 'Actualités'
    folder: 'content/fr/actualites'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Description', name: 'description', widget: 'string' }
      - label: 'Image de vignette (page d''accueil et liste des actualités)'
        name: 'image'
        widget: 'image'
        required: false
        media_folder: '/assets/vignettes'
        public_folder: 'vignettes'
        hint: 'Image en paysage, idéalement moins de 500 Ko. Elle est recadrée automatiquement en 8:5.'
      - { label: 'Texte alternatif de la vignette (laisser vide si elle est purement décorative)', name: 'image_alt', widget: 'string', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown' }