# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: FlorianKohler/Strasbergerie
  branch: main
  identity_url: https://auth.decapbridge.com/sites/c19dbff2-cf90-433f-b83b-3afab17d4534
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://strasbergerie.org

media_folder: static/img
public_folder: /img
collections:
  - name: 'actualites'
    label: 'Actualités'
    folder: 'content/fr/actualites'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Description', name: 'description', widget: 'string' }
      - label: 'Image de vignette (page d''accueil et liste des actualités)'
        name: 'image'
        widget: 'image'
        required: false
        media_folder: '/assets/vignettes'
        public_folder: 'vignettes'
        hint: 'Image en paysage, idéalement moins de 500 Ko. Elle est recadrée automatiquement en 8:5.'
      - { label: 'Texte alternatif de la vignette (laisser vide si elle est purement décorative)', name: 'image_alt', widget: 'string', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown' }